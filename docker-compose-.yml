services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  # -------------------------
  # 🧠 Kafka (KRaft mode)
  # -------------------------
  # 🧠 Kafka (Bitnami - KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: kafka-connect
    depends_on:
      - kafka
      # - minio
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    mem_limit: 2g

  # schema-registry:
  #   image: confluentinc/cp-schema-registry:7.5.0
  #   hostname: schema-registry
  #   container_name: schema-registry
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8085:8081"
  #   environment:
  #     SCHEMA_REGISTRY_HOST_NAME: schema-registry
  #     SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
  #     SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
  #     SCHEMA_REGISTRY_HEAP_OPTS: "-Xms512M -Xmx512M"
  #     SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 30000
      
  # -------------------------
  # 💾 MinIO (S3 Storage)
  # -------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "19000:9000"  
      - "19001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    volumes:
      - minio_data:/data
    mem_limit: 512m

  # -------------------------
  # 🗄️ Cassandra
  # -------------------------
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    mem_limit: 1g

  # -------------------------
  # ⚡ Flink (Job Manager)
  # -------------------------
  flink-jobmanager:
    build: ./docker/flink
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/job1-gps-normalizer
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 10000
        execution.checkpointing.timeout: 120000
        s3.endpoint: http://minio:9000
        s3.access-key: admin
        s3.secret-key: admin123
        s3.path.style.access: true
        rest.port: 8081
    mem_limit: 1g
    volumes:
      - ./flink-jobs:/opt/flink/jobs
      - ./data:/opt/flink/data

  # -------------------------
  # ⚡ Flink (Task Manager)
  # -------------------------
  flink-taskmanager:
    build: ./docker/flink
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
    - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/job1-gps-normalizer
        execution.checkpointing.interval: 60000
        s3.endpoint: http://minio:9000
        s3.access-key: admin
        s3.secret-key: admin123
        s3.path.style.access: true
      # - AWS_ACCESS_KEY_ID=admin
      # - AWS_SECRET_ACCESS_KEY=admin123
      # - ENABLE_BUILT_IN_PLUGINS=flink-s3-fs-hadoop-1.17.2.jar
      # - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      # - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
      # - FLINK_PROPERTIES=fs.s3a.endpoint: http://minio:9000

    mem_limit: 1g
    volumes:
      - ./flink-jobs:/opt/flink/jobs
      - ./data:/opt/flink/data

